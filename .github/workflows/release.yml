name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    outputs:
      release_tag: ${{ steps.publish_release.outputs.release_tag }}

    steps:
      - name: Validate release tag
        id: version
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'Use a version tag such as v0.2.0 or v0.2.0-rc.1.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_ASSET=PidSimulator-win-x64.zip" >> $env:GITHUB_ENV
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Test application
        run: |
          dotnet test tests/PidSimulator.Tests/PidSimulator.Tests.csproj --configuration Release --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows executable
        run: |
          $publishArgs = @(
            'publish', 'src/PidSimulator.App/PidSimulator.App.csproj',
            '--configuration', 'Release', '--runtime', 'win-x64', '--self-contained', 'true',
            '--output', 'publish/win-x64-single', '--nologo', '--verbosity', 'minimal',
            '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:EnableCompressionInSingleFile=true', '-p:DebugType=None', '-p:DebugSymbols=false',
            "-p:Version=$env:RELEASE_VERSION"
          )
          dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package EXE and DEMO only
        run: |
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null
          $zip = Join-Path 'artifacts' $env:RELEASE_ASSET
          Compress-Archive -LiteralPath @('publish/win-x64-single/PidSimulator.exe', 'publish/win-x64-single/DEMO.psim') -DestinationPath $zip -CompressionLevel Optimal
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zip).Path)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if ($entries.Count -ne 2 -or $entries[0] -cne 'DEMO.psim' -or $entries[1] -cne 'PidSimulator.exe') {
              throw 'The release ZIP must contain only PidSimulator.exe and DEMO.psim.'
            }
          } finally { $archive.Dispose() }

      - name: Set up release tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Prepare ZIP checksum and English release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python .github/scripts/release_assets.py prepare --repository "$env:GITHUB_REPOSITORY" --release-tag "$env:RELEASE_TAG" --asset-name PidSimulator-win-x64.zip --zip artifacts/PidSimulator-win-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ZIP and checksum
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--title', "PID Process Simulator $env:RELEASE_TAG", '--notes-file', 'artifacts/release/release-notes.md',
            'artifacts/release/PidSimulator-win-x64.zip', 'artifacts/release/PidSimulator-win-x64.zip.sha256')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  check-published-release:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal-release.yml
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
