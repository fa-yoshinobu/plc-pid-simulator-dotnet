name: Update English release notes
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to update
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: virustotal-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Update English notes and preserve scan results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json body,isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($release.isDraft) { throw 'Only published releases can be updated.' }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ('PidSimulator-win-x64.zip' -notin $assetNames -or 'PidSimulator-win-x64.zip.sha256' -notin $assetNames) { throw 'This release uses legacy assets; keep its original download links.' }
          [IO.File]::WriteAllText('current-body.md', $release.body)
          python .github/scripts/release_assets.py notes --repository "$env:GITHUB_REPOSITORY" --release-tag "$env:RELEASE_TAG" --asset-name PidSimulator-win-x64.zip --current-body current-body.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --notes-file artifacts/release/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
