name: Check bundled runtime

on:
  schedule:
    - cron: '23 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Test runtime update checker without external API calls
        run: python -B -m unittest discover -s tests/release -p test_check_runtime_update.py -v
      - name: Check pinned runtimes against official stable releases
        run: python -B .github/scripts/check_runtime_update.py
